[package]
name = "authy-decryptor-gui"
description = "Desktop GUI (and headless CLI) to decrypt Authy authenticator backup tokens"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "authy-decryptor-gui"
path = "src/main.rs"

[dependencies]
authy-decryptor-core.workspace = true
clap.workspace = true
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
rfd = "0.15"
qrcode = { version = "0.14", default-features = false }
